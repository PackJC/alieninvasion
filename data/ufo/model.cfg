// Flyable UFO: written by tools/alienufo/build.py (change it there, not here).
// The canopy swings up from its hinge at the back; each leg folds up flat under the hull and its pad
// turns to lie flush (source gear: 0 down, 1 up). The pod's light ring and the cockpit's hologram turn
// while the craft is powered (geb_UFO.c sets spin and holo on clients). Signs: a positive angle turns
// +Y towards +Z about +X, the axis running from its first memory point to its second.
class CfgSkeletons
{
	class Default
	{
		isDiscrete=1;
		skeletonInherit="";
		skeletonBones[]={};
	};
	class geb_ufo_skeleton: Default
	{
		skeletonBones[]=
		{
			"canopy","",
			"shimmer","canopy",
			"leg_1","",
			"pad_1","leg_1",
			"leg_2","",
			"pad_2","leg_2",
			"leg_3","",
			"pad_3","leg_3",
			"spinner","",
			"holo","",
			"radar","",
			"crewdriver",""
		};
	};
};
